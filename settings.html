<div class="lorebook-sync-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>✦ LOREBOOK SYNC ✦</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small data-ls-i18n="desc">Синхронизация данных SillyTavern в базы Notion.</small>

            <label for="ls_token">Notion integration token</label>
            <div class="ls-row">
                <input id="ls_token" type="password" class="text_pole"
                       placeholder="ntn_..." autocomplete="off">
                <div id="ls_toggle_token" class="menu_button">Show</div>
            </div>

            <div class="ls-actions">
                <div id="ls_test" class="menu_button" data-ls-i18n="test">Проверить связь</div>
                <div id="ls_sync_all" class="menu_button" data-ls-i18n="syncAll">Синхронизировать всё</div>
                <div id="ls_spinner" class="ls-spinner" aria-hidden="true" title="Идёт синхронизация">✦</div>
                <div class="ls-right">
                    <span id="ls_version" class="ls-version" title="Версия расширения">v0.5.1</span>
                    <div class="ls-langs" role="group" aria-label="Language">
                        <div class="ls-lang" data-ls-lang="ru" title="Русский">RU</div>
                        <div class="ls-lang" data-ls-lang="en" title="English">EN</div>
                        <div class="ls-lang" data-ls-lang="uk" title="Українська">UK</div>
                        <div class="ls-lang" data-ls-lang="sv" title="Svenska">SV</div>
                    </div>
                </div>
            </div>

            <div class="ls-actions ls-actions-second">
                <div id="ls_create_dbs" class="menu_button" data-ls-i18n="create">Создать недостающие базы</div>
            </div>

            <label for="ls_parent_page" class="ls-mini-label" data-ls-i18n="parentLabel">ID страницы Notion для новых баз (необязательно)</label>
            <input id="ls_parent_page" type="text" class="text_pole" placeholder="page id"
                   data-ls-i18n-placeholder="parentPlaceholder">

            <div class="ls-section-title" data-ls-i18n="databases">Базы Notion</div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span data-ls-i18n="lorebooks">📚 Лорбуки</span>
                    <div class="menu_button ls-sync-btn" data-cat="lorebooks">Sync</div>
                </div>
                <input id="ls_db_lorebooks" data-dbcat="lorebooks" type="text" class="text_pole" placeholder="database id">
                <label class="checkbox_label">
                    <input id="ls_include_empty" type="checkbox">
                    <span data-ls-i18n="includeEmpty">включать пустые лорбуки</span>
                </label>
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span data-ls-i18n="characters">🎭 Персонажи</span>
                    <div class="menu_button ls-sync-btn" data-cat="characters">Sync</div>
                </div>
                <input id="ls_db_characters" data-dbcat="characters" type="text" class="text_pole" placeholder="database id">
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span data-ls-i18n="personas">🧑 Персоны</span>
                    <div class="menu_button ls-sync-btn" data-cat="personas">Sync</div>
                </div>
                <input id="ls_db_personas" data-dbcat="personas" type="text" class="text_pole" placeholder="database id">
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span data-ls-i18n="chats">💬 Чаты</span>
                    <div class="menu_button ls-sync-btn" data-cat="chats">Sync</div>
                </div>
                <input id="ls_db_chats" data-dbcat="chats" type="text" class="text_pole" placeholder="database id">
                <div class="ls-row ls-nums">
                    <label class="ls-num">
                        <span data-ls-i18n="chatLimit">чатов на персонажа</span>
                        <input id="ls_chat_limit" class="text_pole" type="number" min="1" max="100">
                    </label>
                    <label class="ls-num">
                        <span data-ls-i18n="msgLimit">сообщений в чате</span>
                        <input id="ls_msg_limit" class="text_pole" type="number" min="1" max="5000">
                    </label>
                </div>
                <label class="checkbox_label">
                    <input id="ls_rewrite_chats" type="checkbox">
                    <span data-ls-i18n="rewriteChats">перезаписывать чаты целиком</span>
                </label>
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span data-ls-i18n="autoTitle">🤖 Авто-синхронизация</span>
                </div>
                <label class="checkbox_label">
                    <input id="ls_auto_sync" type="checkbox">
                    <span data-ls-i18n="autoEnable">авто-синхронизация активного чата</span>
                </label>
                <div class="ls-row ls-nums">
                    <label class="ls-num">
                        <span data-ls-i18n="autoEvery">каждые N сообщений</span>
                        <input id="ls_auto_every" class="text_pole" type="number" min="1" max="1000">
                    </label>
                </div>
            </div>

            <div id="ls_progress" class="ls-progress"></div>
            <div id="ls_log" class="ls-log"></div>
        </div>
    </div>
</div>
