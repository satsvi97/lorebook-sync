<div class="lorebook-sync-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>✦ LOREBOOK SYNC ✦</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small>Синхронизация данных SillyTavern в базы Notion.</small>

            <label for="ls_token">Notion integration token</label>
            <div class="ls-row">
                <input id="ls_token" type="password" class="text_pole"
                       placeholder="ntn_..." autocomplete="off">
                <div id="ls_toggle_token" class="menu_button">Show</div>
            </div>

            <div class="ls-actions">
                <div id="ls_test" class="menu_button">Проверить связь</div>
                <div id="ls_sync_all" class="menu_button">Синхронизировать всё</div>
                <div id="ls_spinner" class="ls-spinner" aria-hidden="true" title="Идёт синхронизация">✦</div>
                <span id="ls_version" class="ls-version" title="Версия расширения">v0.4.0</span>
            </div>

            <div class="ls-actions ls-actions-second">
                <div id="ls_create_dbs" class="menu_button">Создать недостающие базы</div>
            </div>

            <label for="ls_parent_page" class="ls-mini-label">ID страницы Notion для новых баз (необязательно)</label>
            <input id="ls_parent_page" type="text" class="text_pole" placeholder="page id">

            <div class="ls-section-title">Базы Notion</div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span>📚 Лорбуки</span>
                    <div class="menu_button ls-sync-btn" data-cat="lorebooks">Sync</div>
                </div>
                <input id="ls_db_lorebooks" data-dbcat="lorebooks" type="text" class="text_pole" placeholder="database id">
                <label class="checkbox_label">
                    <input id="ls_include_empty" type="checkbox">
                    <span>включать пустые лорбуки</span>
                </label>
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span>🎭 Персонажи</span>
                    <div class="menu_button ls-sync-btn" data-cat="characters">Sync</div>
                </div>
                <input id="ls_db_characters" data-dbcat="characters" type="text" class="text_pole" placeholder="database id">
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span>🧑 Персоны</span>
                    <div class="menu_button ls-sync-btn" data-cat="personas">Sync</div>
                </div>
                <input id="ls_db_personas" data-dbcat="personas" type="text" class="text_pole" placeholder="database id">
            </div>

            <div class="ls-cat">
                <div class="ls-cat-head">
                    <span>💬 Чаты</span>
                    <div class="menu_button ls-sync-btn" data-cat="chats">Sync</div>
                </div>
                <input id="ls_db_chats" data-dbcat="chats" type="text" class="text_pole" placeholder="database id">
                <div class="ls-row ls-nums">
                    <label class="ls-num">
                        <span>чатов на персонажа</span>
                        <input id="ls_chat_limit" type="number" min="1" max="100">
                    </label>
                    <label class="ls-num">
                        <span>сообщений в чате</span>
                        <input id="ls_msg_limit" type="number" min="1" max="5000">
                    </label>
                </div>
                <label class="checkbox_label">
                    <input id="ls_rewrite_chats" type="checkbox">
                    <span>перезаписывать чаты целиком</span>
                </label>
            </div>

            <div id="ls_progress" class="ls-progress"></div>
            <div id="ls_log" class="ls-log"></div>
        </div>
    </div>
</div>
