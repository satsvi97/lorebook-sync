<div class="lorebook-sync-settings">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>Lorebook Sync</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <small>Синхронизация лорбуков из SillyTavern в базу Notion.</small>

            <label for="lorebook_sync_token">Notion integration token</label>
            <div class="ls-row">
                <input id="lorebook_sync_token" type="password" class="text_pole"
                       placeholder="ntn_..." autocomplete="off">
                <div id="lorebook_sync_toggle_token" class="menu_button">Show</div>
            </div>
            <small>Создать токен: Notion → Settings → Connections → Develop or manage integrations.</small>

            <label for="lorebook_sync_database">Notion database ID</label>
            <input id="lorebook_sync_database" type="text" class="text_pole"
                   placeholder="32-символьный id базы">
            <small>ID берётся из ссылки на базу. Не забудьте дать интеграции доступ к базе (Share).</small>

            <label class="checkbox_label">
                <input id="lorebook_sync_include_empty" type="checkbox">
                <span>Включать пустые лорбуки</span>
            </label>

            <div class="ls-actions">
                <div id="lorebook_sync_test" class="menu_button">Проверить связь</div>
                <div id="lorebook_sync_sync" class="menu_button">Синхронизировать в Notion</div>
            </div>

            <div id="lorebook_sync_progress" class="ls-progress"></div>
            <div id="lorebook_sync_log" class="ls-log"></div>
        </div>
    </div>
</div>
